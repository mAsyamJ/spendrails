<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" role="img" aria-label="SpendRail">
  <title>SpendRail</title>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CF2C8"/>
      <stop offset="100%" stop-color="#1DB8A0"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F6FC"/>
      <stop offset="100%" stop-color="#8B9BB4"/>
    </linearGradient>
  </defs>

  <rect width="840" height="280" rx="32" fill="#0B1220"/>
  <rect x="1.5" y="1.5" width="837" height="277" rx="30.5" fill="none" stroke="#1C2A3F" stroke-width="3"/>

  <!-- Icon: rails meeting a spending gate -->
  <g transform="translate(48,46)">
    <rect width="188" height="188" rx="36" fill="#101A2C" stroke="#24344C" stroke-width="3"/>

    <!-- track bed -->
    <rect x="22" y="78" width="144" height="32" rx="6" fill="#162033"/>

    <!-- left rails -->
    <rect x="22" y="84" width="62" height="7" rx="3.5" fill="url(#rail)"/>
    <rect x="22" y="97" width="62" height="7" rx="3.5" fill="url(#rail)"/>

    <!-- right rails -->
    <rect x="104" y="84" width="62" height="7" rx="3.5" fill="url(#rail)"/>
    <rect x="104" y="97" width="62" height="7" rx="3.5" fill="url(#rail)"/>

    <!-- gate posts -->
    <rect x="78" y="52" width="10" height="84" rx="3" fill="url(#gate)"/>
    <rect x="100" y="52" width="10" height="84" rx="3" fill="url(#gate)"/>

    <!-- barrier -->
    <rect x="78" y="52" width="32" height="10" rx="3" fill="#F0F6FC"/>

    <!-- ALLOW / ASK / BLOCK lamps -->
    <circle cx="83" cy="74" r="5" fill="#3FB950"/>
    <circle cx="94" cy="74" r="5" fill="#D29922"/>
    <circle cx="105" cy="74" r="5" fill="#F85149"/>
  </g>

  <!-- Wordmark -->
  <text x="268" y="128" fill="#F0F6FC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="750" letter-spacing="-1.5">Spend</text>
  <text x="468" y="128" fill="#5CF2C8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="750" letter-spacing="-1.5">Rail</text>
  <text x="268" y="168" fill="#8B9BB4" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="500" letter-spacing="0.4">Give AI a budget, not your wallet.</text>

  <!-- Decision legend -->
  <g transform="translate(268,198)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700">
    <circle cx="8" cy="8" r="6" fill="#3FB950"/>
    <text x="20" y="13" fill="#9BE9A8">ALLOW</text>
    <circle cx="108" cy="8" r="6" fill="#D29922"/>
    <text x="120" y="13" fill="#E3B341">ASK</text>
    <circle cx="188" cy="8" r="6" fill="#F85149"/>
    <text x="200" y="13" fill="#FFA198">BLOCK</text>
  </g>
</svg>
